#Iris, ya con el shaderpack de TKM puesto y encendido.
#Se copia solo si no existe: si el jugador se cambia de pack o los apaga
#(tecla K), su eleccion sobrevive a la siguiente actualizacion del mod.
shaderPack=ComplementaryUnbound_r5.9.3.zip
enableShaders=true
disableUpdateMessage=true
#Las sombras se re-renderizan en un pase aparte, asi que pasarse de la
#distancia de renderizado (16 chunks) es trabajo que no se ve. Iris trae 32.
maxShadowRenderDistance=16
