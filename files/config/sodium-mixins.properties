# This is the configuration file for Sodium.
#
# You can find information on editing this file and all the available options here:
# https://github.com/CaffeineMC/sodium/wiki/Configuration-File
#
# By default, this file will be empty except for this notice.

# Sodium deja apagar sus mixins por paquete. Aqui solo se apaga la GUI: todo lo
# que hace que Sodium sea rapido sigue puesto.
#
# Sodium sustituye la pantalla de ajustes de video entera por la suya, cuatro
# pestanas de opciones tecnicas. Apagando este paquete vuelve la de vanilla,
# con el boton de shaders que le cuelga Iris. Las opciones propias de Sodium
# dejan de verse en el juego; viven en config/sodium-options.json y ya estan
# como las queremos.
#
# Este fichero va en config-fija/ y NO en config/, o sea que el instalador lo
# PISA cada vez. Es a proposito y es un fallo que costo entender: Sodium se
# escribe el suyo -esta misma cabecera, sin nuestra linea- la primera vez que
# arranca, asi que a quien ya habia jugado antes de que existiera esto el
# instalador se lo saltaba para siempre por "ya existe" y seguia viendo el menu
# de Sodium. Aqui no hay eleccion de nadie que respetar: es que mixins carga el
# juego, y eso lo decide el paquete.
mixin.features.gui.hooks.settings=false
